<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente de Prueba - Bookify</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background-color: #f4f4f9; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        input[type="text"] { width: 70%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        .card { background-color: #2d2d2d; color: #a9b7c6; padding: 15px; border-radius: 5px; margin-bottom: 10px; overflow-x: auto; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Prueba de API Bookify</h1>
        <p>Ingresa tu token de administrador para obtener los datos desde el backend.</p>

        <div class="form-group">
            <input type="text" id="apiToken" placeholder="Pega tu token aquí (ej. 9944b09199c...)">
            <button onclick="cargarDatos('/api/espacios/')">Obtener Datos</button>
        </div>

        <hr>
        <h2>Resultados:</h2>
        <div id="resultados">
            <p style="color: #666;">Los datos aparecerán aquí...</p>
        </div>
    </div>

    <script>
        function cargarDatos(endpoint) {
            const token = document.getElementById('apiToken').value.trim();
            const contenedor = document.getElementById('resultados');

            if (!token) {
                alert("Por favor, ingresa tu Token de autorización.");
                return;
            }

            contenedor.innerHTML = "<p>Cargando datos...</p>";

            // Hacemos la petición Fetch a tu API
            fetch(endpoint, {
                method: 'GET',
                headers: {
                    'Authorization': 'Token ' + token,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (!response.ok) {
                    if (response.status === 401) throw new Error("Error 401: Token inválido o no autorizado.");
                    if (response.status === 404) throw new Error("Error 404: Endpoint no encontrado. Revisa la URL en el código HTML.");
                    throw new Error("Error en la petición: " + response.status);
                }
                return response.json(); // Convertimos la respuesta a JSON
            })
            .then(data => {
                contenedor.innerHTML = ""; // Limpiamos el mensaje de "Cargando"
                
                // Si la API devuelve un array de objetos
                if (Array.isArray(data)) {
                    if (data.length === 0) contenedor.innerHTML = "<p>No hay datos registrados aún.</p>";
                    data.forEach(item => {
                        contenedor.innerHTML += `
                            <div class="card">
                                <pre>${JSON.stringify(item, null, 4)}</pre>
                            </div>
                        `;
                    });
                } else {
                    // Si devuelve un solo objeto (por ejemplo, con paginación)
                    contenedor.innerHTML = `
                        <div class="card">
                            <pre>${JSON.stringify(data, null, 4)}</pre>
                        </div>
                    `;
                }
            })
            .catch(error => {
                contenedor.innerHTML = `<p style="color: red; font-weight: bold;">${error.message}</p>`;
            });
        }
    </script>
</body>
</html>
